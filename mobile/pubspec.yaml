name: ssgestion_app
description: S&S Gestión — app móvil para Jefe de Obra (MVP online; offline en v2).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0                    # cliente HTTP (más simple que dio para el MVP)
  shared_preferences: ^2.3.0      # token + proyecto activo persistidos
  intl: ^0.19.0                   # formato de fechas
  uuid: ^4.4.0                    # client_uuid para idempotencia

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
